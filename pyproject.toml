[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backupforge"
version = "0.1.0"
description = "Incremental, verifiable backup tool using hardlink snapshots"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
backupforge = "backup:main"

[tool.setuptools]
py-modules = ["backup"]